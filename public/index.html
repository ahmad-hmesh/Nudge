<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My To-Do List</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --navy-deep: #00203f;
    --navy-panel: #0a2c52;
    --navy-line: #163d68;
    --mint: #adefd1;
    --mint-dim: #7fc7ab;
    --ink: #eaf6f1;
    --ink-muted: #8fa8bd;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--navy-deep);
    background-image: radial-gradient(circle at 50% 0%, #0a2c52 0%, #00203f 60%);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    padding: 48px 20px 80px;
  }

  .page { max-width: 560px; margin: 0 auto; }

  header { text-align: center; margin-bottom: 28px; }

  h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 2rem;
    letter-spacing: -0.02em;
    margin: 0;
    display: inline-block;
    position: relative;
  }

  h1::after {
    content: '';
    display: block;
    height: 6px;
    width: 60%;
    margin: 6px auto 0;
    background: var(--mint);
    border-radius: 3px;
    opacity: 0.85;
  }

  .notify-banner {
    display: none;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    background: var(--navy-panel);
    border: 1px solid var(--mint-dim);
    border-radius: 10px;
    padding: 12px 16px;
    margin-bottom: 20px;
    font-size: 0.85rem;
  }

  .notify-banner button {
    background: var(--mint);
    color: var(--navy-deep);
    border: none;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 0.82rem;
    padding: 7px 14px;
    border-radius: 8px;
    cursor: pointer;
    white-space: nowrap;
  }

  #newTask {
    width: 100%;
    background: var(--navy-panel);
    border: 1px solid var(--navy-line);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    font-size: 0.95rem;
    padding: 13px 16px;
    border-radius: 10px;
    outline: none;
    margin-bottom: 10px;
    transition: border-color 0.15s ease;
  }

  #newTask::placeholder { color: var(--ink-muted); }
  #newTask:focus { border-color: var(--mint); box-shadow: 0 0 0 3px rgba(173, 239, 209, 0.15); }

  .field-row { display: flex; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
  .field-row > * { flex: 1 1 30%; min-width: 100px; }

  #dueDate, #remindTime, #priority, #category {
    background: var(--navy-panel);
    border: 1px solid var(--navy-line);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    font-size: 0.88rem;
    padding: 11px 12px;
    border-radius: 10px;
    outline: none;
    color-scheme: dark;
    transition: border-color 0.15s ease;
  }

  #priority {
    appearance: none;
    -webkit-appearance: none;
    background-image: linear-gradient(45deg, transparent 50%, var(--mint-dim) 50%), linear-gradient(135deg, var(--mint-dim) 50%, transparent 50%);
    background-position: calc(100% - 16px) center, calc(100% - 11px) center;
    background-size: 5px 5px, 5px 5px;
    background-repeat: no-repeat;
  }

  #dueDate:focus, #remindTime:focus, #priority:focus, #category:focus {
    border-color: var(--mint);
    box-shadow: 0 0 0 3px rgba(173, 239, 209, 0.15);
  }

  #category { width: 100%; margin-bottom: 10px; }

  #addBtn {
    width: 100%;
    background: var(--mint);
    color: var(--navy-deep);
    border: none;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 0.95rem;
    padding: 13px 0;
    border-radius: 10px;
    cursor: pointer;
    margin-bottom: 28px;
    transition: background 0.15s ease, transform 0.1s ease;
  }

  #addBtn:hover { background: var(--mint-dim); }
  #addBtn:active { transform: scale(0.98); }

  .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; gap: 10px; }

  #searchBox {
    flex: 1;
    background: var(--navy-panel);
    border: 1px solid var(--navy-line);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    font-size: 0.88rem;
    padding: 10px 14px;
    border-radius: 10px;
    outline: none;
  }

  #searchBox::placeholder { color: var(--ink-muted); }
  #searchBox:focus { border-color: var(--mint); box-shadow: 0 0 0 3px rgba(173, 239, 209, 0.15); }

  #taskCount { font-size: 0.8rem; color: var(--ink-muted); white-space: nowrap; }

  .card { background: var(--navy-panel); border: 1px solid var(--navy-line); border-radius: 14px; overflow: hidden; }

  table { width: 100%; border-collapse: collapse; }
  tbody tr { border-bottom: 1px solid var(--navy-line); transition: background 0.15s ease; }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: rgba(173, 239, 209, 0.04); }

  td { padding: 14px 16px; vertical-align: middle; }
  .col-check { width: 44px; }
  .col-action { width: 76px; display: flex; gap: 2px; justify-content: center; align-items: center; }

  .check-wrap { display: inline-flex; cursor: pointer; }
  .check-wrap input { display: none; }

  .check-mark {
    width: 22px; height: 22px; border-radius: 50%;
    border: 2px solid var(--mint-dim);
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s ease;
  }

  .check-wrap input:checked + .check-mark { background: var(--mint); border-color: var(--mint); transform: scale(1.05); }
  .check-mark svg { width: 12px; height: 12px; opacity: 0; transform: scale(0.5); transition: all 0.15s ease; }
  .check-wrap input:checked + .check-mark svg { opacity: 1; transform: scale(1); }

  .task-title { font-size: 0.98rem; color: var(--ink); display: inline-block; }
  tr.done .task-title { text-decoration: line-through; color: var(--ink-muted); }

  .meta-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 5px; }

  .priority-badge { font-size: 0.7rem; font-weight: 700; padding: 2px 9px; border-radius: 20px; letter-spacing: 0.02em; }
  .priority-low { color: var(--mint-dim); border: 1px solid var(--mint-dim); }
  .priority-medium { color: var(--navy-deep); background: rgba(173, 239, 209, 0.4); }
  .priority-high { color: var(--navy-deep); background: var(--mint); }

  .category-tag { font-size: 0.7rem; padding: 2px 9px; border-radius: 6px; background: var(--navy-line); color: var(--ink-muted); }

  .due-label { font-size: 0.7rem; color: var(--mint-dim); }
  tr.done .due-label { color: var(--ink-muted); }
  .due-label.overdue { color: var(--mint); font-weight: 700; }
  .due-label.overdue::before { content: '● '; }

  .icon-btn {
    background: none; border: none; color: var(--ink-muted); cursor: pointer;
    padding: 6px; border-radius: 8px; display: inline-flex;
    transition: color 0.15s ease, background 0.15s ease;
  }
  .icon-btn:hover { color: var(--mint); background: rgba(173, 239, 209, 0.08); }
  .icon-btn svg { width: 17px; height: 17px; }

  .edit-input {
    width: 100%;
    background: var(--navy-deep);
    border: 1px solid var(--mint);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    font-size: 0.95rem;
    padding: 6px 10px;
    border-radius: 6px;
    outline: none;
  }

  .empty-state { text-align: center; padding: 36px 16px; color: var(--ink-muted); font-size: 0.92rem; font-style: italic; }
</style>
</head>
<body>
  <div class="page">
    <header><h1>My To-Do List</h1></header>

    <div class="notify-banner" id="notifyBanner">
      <span>Enable notifications to get task reminders</span>
      <button onclick="enableNotifications()">Enable</button>
    </div>

    <input type="text" id="newTask" placeholder="What needs doing?">

    <div class="field-row">
      <input type="date" id="dueDate">
      <select id="priority">
        <option value="low">Low</option>
        <option value="medium" selected>Medium</option>
        <option value="high">High</option>
      </select>
      <input type="time" id="remindTime" value="13:00">
    </div>

    <input type="text" id="category" placeholder="Category (optional)">

    <button id="addBtn" onclick="addTask()">Add Task</button>

    <div class="top-bar">
      <input type="text" id="searchBox" placeholder="Search tasks...">
      <span id="taskCount"></span>
    </div>

    <div class="card">
      <table><tbody id="taskList"></tbody></table>
    </div>
  </div>

  <script>
    const checkIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="#00203f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>`;
    const trashIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path><path d="M10 11v6"></path><path d="M14 11v6"></path><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"></path></svg>`;
    const editIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>`;

    let currentTasks = [];

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function parseDateOnly(dateStr) {
      const [year, month, day] = dateStr.split('-').map(Number);
      return new Date(year, month - 1, day);
    }

    function formatDueDate(dateStr) {
      return parseDateOnly(dateStr).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
    }

    function isOverdue(dateStr) {
      const due = parseDateOnly(dateStr);
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      return due < today;
    }

    function priorityBadge(priority) {
      const cls = ['low', 'medium', 'high'].includes(priority) ? priority : 'medium';
      const labels = { low: 'Low', medium: 'Medium', high: 'High' };
      return `<span class="priority-badge priority-${cls}">${labels[cls]}</span>`;
    }

    function updateTaskCount(tasks) {
      const total = tasks.length;
      const done = tasks.filter(t => t.done).length;
      document.getElementById('taskCount').textContent = total === 0 ? '' : `${done} of ${total} done`;
    }

    async function loadTasks() {
      const res = await fetch('/tasks');
      currentTasks = await res.json();
      renderTasks();
      checkReminders();
    }

    function renderTasks() {
      const list = document.getElementById('taskList');
      const query = document.getElementById('searchBox').value.trim().toLowerCase();
      const filtered = query ? currentTasks.filter(t => t.title.toLowerCase().includes(query)) : currentTasks;

      updateTaskCount(currentTasks);
      list.innerHTML = '';

      if (currentTasks.length === 0) {
        list.innerHTML = `<tr><td colspan="3" class="empty-state">No tasks yet — add one above to get started.</td></tr>`;
        return;
      }
      if (filtered.length === 0) {
        list.innerHTML = `<tr><td colspan="3" class="empty-state">No tasks match your search.</td></tr>`;
        return;
      }

      filtered.forEach(task => {
        const isDone = !!task.done;
        const overdue = task.due_date && !isDone && isOverdue(task.due_date);
        const tr = document.createElement('tr');
        tr.className = isDone ? 'done' : '';

        const metaParts = [];
        if (task.due_date) {
          metaParts.push(`<span class="due-label ${overdue ? 'overdue' : ''}">${overdue ? 'Overdue — ' : 'Due '}${formatDueDate(task.due_date)}</span>`);
        }
        metaParts.push(priorityBadge(task.priority));
        if (task.category) {
          metaParts.push(`<span class="category-tag">${escapeHtml(task.category)}</span>`);
        }

        tr.innerHTML = `
          <td class="col-check">
            <label class="check-wrap">
              <input type="checkbox" ${isDone ? 'checked' : ''} onchange="toggleDone(${task.id}, this.checked)">
              <span class="check-mark">${checkIcon}</span>
            </label>
          </td>
          <td>
            <span class="task-title" id="title-${task.id}">${escapeHtml(task.title)}</span>
            <div class="meta-row">${metaParts.join('')}</div>
          </td>
          <td class="col-action">
            <button class="icon-btn" onclick="startEdit(${task.id})">${editIcon}</button>
            <button class="icon-btn" onclick="deleteTask(${task.id})">${trashIcon}</button>
          </td>
        `;
        list.appendChild(tr);
      });
    }

    async function addTask() {
      const titleInput = document.getElementById('newTask');
      const dueInput = document.getElementById('dueDate');
      const priorityInput = document.getElementById('priority');
      const remindInput = document.getElementById('remindTime');
      const categoryInput = document.getElementById('category');

      const title = titleInput.value.trim();
      if (!title) return;

      const body = { title, priority: priorityInput.value };
      if (dueInput.value) body.due_date = dueInput.value;
      if (categoryInput.value.trim()) body.category = categoryInput.value.trim();
      if (remindInput.value) body.remind_time = remindInput.value;

      await fetch('/tasks', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });

      titleInput.value = '';
      dueInput.value = '';
      categoryInput.value = '';
      priorityInput.value = 'medium';
      remindInput.value = '13:00';
      titleInput.focus();

      loadTasks();
    }

    document.getElementById('newTask').addEventListener('keydown', e => {
      if (e.key === 'Enter') addTask();
    });

    document.getElementById('searchBox').addEventListener('input', renderTasks);

    async function toggleDone(id, done) {
      await fetch(`/tasks/${id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ done })
      });
      loadTasks();
    }

    async function deleteTask(id) {
      if (!confirm("Delete this task? This can't be undone.")) return;
      await fetch(`/tasks/${id}`, { method: 'DELETE' });
      loadTasks();
    }

    function startEdit(id) {
      const titleEl = document.getElementById(`title-${id}`);
      const currentTitle = titleEl.textContent;

      const input = document.createElement('input');
      input.type = 'text';
      input.className = 'edit-input';
      input.value = currentTitle;
      input.id = `title-${id}`;

      let submitted = false;
      const submit = () => {
        if (submitted) return;
        submitted = true;
        saveEdit(id, input.value);
      };

      input.addEventListener('keydown', e => {
        if (e.key === 'Enter') submit();
        if (e.key === 'Escape') { submitted = true; renderTasks(); }
      });
      input.addEventListener('blur', submit);

      titleEl.replaceWith(input);
      input.focus();
      input.select();
    }

    async function saveEdit(id, newTitle) {
      newTitle = newTitle.trim();
      if (!newTitle) { renderTasks(); return; }

      await fetch(`/tasks/${id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title: newTitle })
      });
      loadTasks();
    }

    // --- Reminders (Notification API, requires tab open + permission) ---

    function todayLocalStr() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }

    function getRemindedLog() {
      try { return JSON.parse(localStorage.getItem('remindedLog') || '{}'); }
      catch { return {}; }
    }

    function markReminded(taskId) {
      const log = getRemindedLog();
      log[taskId] = todayLocalStr();
      localStorage.setItem('remindedLog', JSON.stringify(log));
    }

    function wasRemindedToday(taskId) {
      return getRemindedLog()[taskId] === todayLocalStr();
    }

    function checkReminders() {
      if (!('Notification' in window) || Notification.permission !== 'granted') return;
      const now = new Date();
      const nowHM = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;

      currentTasks.forEach(task => {
        if (task.done || !task.remind_time) return;
        if (wasRemindedToday(task.id)) return;
        if (nowHM >= task.remind_time) {
          new Notification('Task reminder', { body: task.title });
          markReminded(task.id);
        }
      });
    }

    function initNotifyBanner() {
      if (!('Notification' in window)) return;
      if (Notification.permission === 'default') {
        document.getElementById('notifyBanner').style.display = 'flex';
      }
    }

    function enableNotifications() {
      Notification.requestPermission().then(() => {
        document.getElementById('notifyBanner').style.display = 'none';
        checkReminders();
      });
    }

    initNotifyBanner();
    loadTasks();
    setInterval(checkReminders, 30000);
  </script>
</body>
</html>
